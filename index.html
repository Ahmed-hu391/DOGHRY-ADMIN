<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>دُغري | لوحة الإدارة</title>
  <meta name="theme-color" content="#0a101c" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f3f5f9;--panel:#fff;--panel-2:#f6f8fb;--text:#101828;--muted:#667085;--line:#e4e8ef;
      --primary:#2350c8;--primary-soft:#e8eefc;--on-primary:#fff;
      --gold:#a8720f;--gold-soft:#fbf1d9;
      --ok:#127a3e;--ok-soft:#dcf5e5;--warn:#a85c00;--warn-soft:#fdeccd;--bad:#b42318;--bad-soft:#fde4e1;
      --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.05);
    }
    :root[data-theme="dark"]{
      --bg:#0a101c;--panel:#111a2b;--panel-2:#16213a;--text:#eef2f8;--muted:#93a0b8;--line:#22304a;
      --primary:#6b9bff;--primary-soft:rgba(107,155,255,.14);--on-primary:#0a101c;
      --gold:#f0bf5e;--gold-soft:rgba(240,191,94,.13);
      --ok:#4fd98a;--ok-soft:rgba(79,217,138,.13);--warn:#f5b544;--warn-soft:rgba(245,181,68,.13);--bad:#ff8a80;--bad-soft:rgba(255,138,128,.13);
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;min-height:100vh;font-family:"Cairo",system-ui,sans-serif;font-size:14px;line-height:1.6;background:var(--bg);color:var(--text);transition:background .3s,color .3s}
    button,input,select,textarea{font:inherit;color:inherit}
    button{border:0;background:none;cursor:pointer}
    :focus-visible{outline:2px solid var(--primary);outline-offset:2px}
    [hidden]{display:none!important}
    svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
    .num{font-variant-numeric:tabular-nums}

    /* ---------- buttons ---------- */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:13px;white-space:nowrap;text-decoration:none;transition:background .18s,border-color .18s,opacity .18s}
    .btn:hover{background:var(--panel-2);border-color:color-mix(in srgb,var(--primary) 35%,var(--line))}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .btn.icon{width:40px;padding:0}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
    .btn.primary:hover{opacity:.9;background:var(--primary)}
    .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
    :root[data-theme="dark"] .btn.ok{color:#06210f}
    .btn.ok:hover{opacity:.9;background:var(--ok)}
    .btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
    .btn.bad:hover{background:var(--bad-soft);opacity:.85}
    .btn.block{width:100%}

    /* ---------- topbar ---------- */
    .topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .topbar-in{max-width:1320px;margin:auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
    .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
    .mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);font-weight:800;font-size:18px}
    .brand strong{display:block;line-height:1.2}
    .brand span{display:block;color:var(--muted);font-size:12px;line-height:1.2}
    .top-actions{display:flex;gap:8px}
    .wrap{max-width:1320px;margin:auto;padding:16px 14px 60px}

    /* ---------- stats (act as filters) ---------- */
    .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
    .stat{text-align:right;padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);transition:border-color .18s,background .18s}
    .stat:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}
    .stat .l{display:block;color:var(--muted);font-size:13px;font-weight:600}
    .stat .v{display:block;font-size:30px;font-weight:800;line-height:1.2;margin-top:2px}
    .stat .h{display:block;font-size:12px;color:var(--muted)}
    .stat.on{border-color:var(--primary);background:var(--primary-soft)}
    .stat.pending .v{color:var(--warn)}.stat.approved .v{color:var(--ok)}.stat.rejected .v{color:var(--bad)}

    /* ---------- tabs + toolbar ---------- */
    .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
    .tab{padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
    .tab.on{color:var(--primary);border-color:var(--primary)}
    .pill{background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:0 8px;font-size:12px;color:var(--muted);line-height:20px}
    .tab.on .pill{background:var(--primary-soft);color:var(--primary);border-color:transparent}
    .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
    .search{grid-column:1/-1;position:relative}
    .search svg{position:absolute;top:50%;right:13px;transform:translateY(-50%);color:var(--muted)}
    .field,.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:0 12px;outline:none}
    .search input{padding-right:40px}
    .field:focus,.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}

    /* ---------- list ---------- */
    .layout{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
    .list-head{display:flex;align-items:center;gap:10px;padding:0 4px 8px;color:var(--muted);font-size:13px}
    .list-head label{display:flex;align-items:center;gap:8px;cursor:pointer}
    .list-head .sp{flex:1}
    input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary);cursor:pointer}
    .list{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
    .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s;position:relative}
    .row:last-child{border-bottom:0}
    .row:hover{background:var(--panel-2)}
    .row.active{background:var(--primary-soft)}
    .row.active::before{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--primary)}
    .row .pick{padding:6px;margin:-6px}
    .av{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);font-weight:800;color:var(--primary)}
    .row-main{flex:1;min-width:0}
    .row-main strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row-main span{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
    .badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700;line-height:22px;white-space:nowrap}
    .badge.pending{background:var(--warn-soft);color:var(--warn)}
    .badge.approved{background:var(--ok-soft);color:var(--ok)}
    .badge.rejected{background:var(--bad-soft);color:var(--bad)}
    .vis{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
    .vis.on{color:var(--ok)}
    .vis svg{width:14px;height:14px}
    .bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;margin-bottom:10px;border-radius:14px;background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 30%,transparent)}
    .bulk b{flex:1;min-width:110px}
    .bulk .btn{height:36px}
    .more{margin:12px auto 0;display:flex}
    .empty{padding:44px 18px;text-align:center;color:var(--muted)}
    .empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
    .sk{height:66px;margin:10px 14px;border-radius:12px;background:linear-gradient(90deg,var(--panel-2),var(--line),var(--panel-2));background-size:200% 100%;animation:sk 1.3s linear infinite}
    @keyframes sk{to{background-position:-200% 0}}

    /* contributors tab */
    .rank{flex:none;width:28px;text-align:center;color:var(--muted);font-weight:700}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
    .chip{font-size:12px;border-radius:8px;padding:0 8px;line-height:22px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
    .chip.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent;font-weight:700}

    /* ---------- detail ---------- */
    .detail{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
    .detail .pad{padding:16px}
    .d-empty{padding:60px 24px;text-align:center;color:var(--muted)}
    .d-empty strong{display:block;color:var(--text);margin-bottom:4px}
    .d-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}
    .d-head .av{width:48px;height:48px;font-size:18px}
    .d-head h3{margin:0;font-size:17px;line-height:1.3}
    .d-head p{margin:0;color:var(--muted);font-size:13px}
    .d-head .grow{flex:1;min-width:0}
    .sheet-close{display:none}
    .visbox{display:flex;gap:11px;padding:12px 14px;border-radius:12px;margin-bottom:14px}
    .visbox strong{display:block;line-height:1.4}
    .visbox span{font-size:13px;opacity:.9}
    .visbox.ok{background:var(--ok-soft);color:var(--ok)}
    .visbox.warn{background:var(--warn-soft);color:var(--warn)}
    .visbox.bad{background:var(--bad-soft);color:var(--bad)}
    .visbox svg{margin-top:3px}
    .sec{margin-bottom:16px}
    .sec h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:700}
    .contact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .contact .ph{flex:1;font-weight:700;font-size:16px;min-width:120px}
    dl.fields{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
    dl.fields div{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
    dl.fields div:last-child{border-bottom:0}
    dl.fields dt{color:var(--muted);font-size:13px}
    dl.fields dd{margin:0;font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}
    .pts{display:flex;gap:8px}
    .pts input{width:110px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--panel);padding:0 12px;outline:none;font-weight:700}
    .pts input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
    .d-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel);border-radius:0 0 16px 16px}
    .d-actions .btn{height:44px}
    .d-foot{display:flex;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
    .d-foot .sp{flex:1}
    .hint{font-size:12px;color:var(--muted)}
    .scrim{position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:55;opacity:0;visibility:hidden;transition:.25s}
    .scrim.on{opacity:1;visibility:visible}

    /* ---------- login / splash ---------- */
    .splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:200}
    .spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--primary);animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:var(--bg)}
    .login.hidden{display:none}
    .login-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:24px}
    .login-card .brand{margin-bottom:18px}
    .lf{margin-bottom:12px}
    .lf label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
    .lf .in{position:relative}
    .lf input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:0 14px;outline:none}
    .lf input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
    .lf .eye{position:absolute;left:6px;top:4px;width:40px;height:40px;display:grid;place-items:center;color:var(--muted)}
    .login-err{color:var(--bad);background:var(--bad-soft);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}

    /* ---------- modal ---------- */
    .mb{position:fixed;inset:0;z-index:80;display:grid;place-items:end center;padding:0;background:rgba(2,6,23,.55);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
    .mb.open{opacity:1;visibility:visible}
    .modal{width:min(640px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px;transform:translateY(24px);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
    .mb.open .modal{transform:none}
    .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .modal-head h3{margin:0;font-size:17px}
    .mf{display:grid;gap:12px}
    .mf .two{display:grid;gap:12px}
    .mf label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
    .mf input,.mf select,.mf textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:9px 12px;outline:none}
    .mf input,.mf select{height:44px}
    .mf textarea{min-height:84px;resize:vertical}
    .mf input:focus,.mf select:focus,.mf textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
    .mf .sub{margin:4px 0 0;font-size:13px;font-weight:700;color:var(--muted);padding-top:10px;border-top:1px solid var(--line)}
    .modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
    .modal-actions .btn{height:46px}
    .dialog p{margin:0 0 4px;color:var(--muted)}

    /* ---------- toast ---------- */
    .toast{position:fixed;z-index:150;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:12px;background:#111827;color:#fff;font-size:13.5px;box-shadow:0 14px 40px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.3s;max-width:calc(100vw - 24px)}
    .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
    .toast.err{background:#7f1d1d}
    .toast button{color:#93c5fd;font-weight:800}

    @media (min-width:700px){
      .stats{grid-template-columns:repeat(4,1fr)}
      .toolbar{grid-template-columns:1fr 200px 200px}
      .search{grid-column:auto}
      .mb{place-items:center;padding:16px}.modal{border-radius:20px}
      .mf .two{grid-template-columns:1fr 1fr}
    }
    @media (min-width:1000px){
      .layout.has-detail{grid-template-columns:minmax(0,1fr) 430px;align-items:start}
      .detail{position:sticky;top:76px;max-height:calc(100vh - 92px);display:flex;flex-direction:column;overflow:hidden}
      .detail .scroll{overflow:auto;flex:1}
    }
    @media (max-width:999px){
      .detail{position:fixed;z-index:60;left:0;right:0;bottom:0;max-height:92vh;border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden}
      .detail.open{transform:none}
      .detail .scroll{overflow:auto;flex:1}
      .sheet-close{display:inline-flex}
      .d-actions{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
      .row-side .vis{display:none}
    }
    @media (max-width:560px){.brand span{display:none}.top-actions .btn .t{display:none}}
    @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  </style>
</head>
<body>
  <div class="splash" id="splash"><div class="spinner"></div></div>

  <!-- Login -->
  <div class="login hidden" id="loginScreen">
    <div class="login-card">
      <div class="brand"><div class="mark">د</div><div><strong>دُغري — لوحة الإدارة</strong><span>سجّل دخولك عشان تراجع المساهمات</span></div></div>
      <form id="loginForm" novalidate>
        <div class="login-err" id="loginErr" hidden></div>
        <div class="lf"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" dir="ltr" required></div>
        <div class="lf"><label for="password">كلمة المرور</label><div class="in"><input id="password" type="password" autocomplete="current-password" dir="ltr" required><button class="eye" id="pwToggle" type="button" aria-label="إظهار كلمة المرور"></button></div></div>
        <button class="btn primary block" id="loginBtn" type="submit" style="height:48px;margin-top:6px">دخول</button>
      </form>
    </div>
  </div>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar"><div class="topbar-in">
      <div class="brand"><div class="mark">د</div><div><strong>دُغري</strong><span>لوحة الإدارة والمراجعة</span></div></div>
      <div class="top-actions">
        <button class="btn icon" id="refreshBtn" type="button" title="تحديث" aria-label="تحديث"></button>
        <button class="btn" id="exportBtn" type="button" title="تصدير Excel/CSV"><span id="exportIc"></span><span class="t">تصدير</span></button>
        <button class="btn icon" id="themeToggle" type="button" aria-label="تبديل الوضع"></button>
        <button class="btn" id="logoutBtn" type="button"><span id="logoutIc"></span><span class="t">خروج</span></button>
      </div>
    </div></header>

    <main class="wrap">
      <section class="stats" id="stats" aria-label="فلترة بالحالة"></section>

      <div class="tabs" role="tablist">
        <button class="tab on" role="tab" data-tab="contrib" id="tabContrib">المساهمات <span class="pill num" id="tabContribN">0</span></button>
        <button class="tab" role="tab" data-tab="people" id="tabPeople">المساهمين <span class="pill num" id="tabPeopleN">0</span></button>
      </div>

      <div class="toolbar">
        <div class="search"><span id="searchIc"></span><input id="searchInput" type="search" placeholder="ابحث بالاسم أو الموبايل أو أي تفصيلة..." autocomplete="off"></div>
        <select class="field" id="typeFilter" aria-label="نوع المساهمة"></select>
        <select class="field" id="sortSel" aria-label="الترتيب">
          <option value="new">الأحدث أولًا</option>
          <option value="old">الأقدم أولًا</option>
          <option value="points">الأعلى نقاطًا</option>
        </select>
      </div>

      <div class="layout has-detail" id="layout">
        <section>
          <div class="bulk" id="bulkBar" hidden>
            <b id="bulkCount"></b>
            <button class="btn ok" data-bulk="approved" type="button">اعتماد المحدد</button>
            <button class="btn bad" data-bulk="rejected" type="button">رفض المحدد</button>
            <button class="btn" data-bulk="clear" type="button">إلغاء التحديد</button>
          </div>
          <div class="list-head" id="listHead"></div>
          <div class="list" id="list"></div>
          <button class="btn more" id="moreBtn" type="button" hidden>عرض المزيد</button>
        </section>
        <aside class="detail" id="detail" aria-live="polite"></aside>
      </div>
    </main>
  </div>
  <div class="scrim" id="scrim"></div>

  <!-- Edit modal -->
  <div class="mb" id="editBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <div class="modal-head"><h3 id="editTitle">تعديل المساهمة</h3><button class="btn icon" id="editClose" type="button" aria-label="إغلاق"></button></div>
      <form class="mf" id="editForm">
        <div class="two"><div><label for="editName">اسم المساهم</label><input id="editName" required></div><div><label for="editPhone">رقم الموبايل</label><input id="editPhone" dir="ltr" inputmode="tel" required></div></div>
        <div class="two"><div><label for="editType">نوع المساهمة</label><select id="editType"></select></div><div><label for="editStatus">الحالة</label><select id="editStatus"><option value="pending">تحت المراجعة</option><option value="approved">معتمدة</option><option value="rejected">مرفوضة</option></select></div></div>
        <div><label for="editPoints">النقاط</label><input id="editPoints" type="number" min="0" step="1" inputmode="numeric" required></div>
        <div class="sub" id="editSub">تفاصيل المساهمة</div>
        <div class="mf" id="editFields"></div>
        <div class="modal-actions"><button class="btn" id="cancelEdit" type="button">إلغاء</button><button class="btn primary" id="saveEdit" type="submit">حفظ التعديلات</button></div>
      </form>
    </div>
  </div>

      <div class="modal-actions"><button class="btn" id="dlgCancel" type="button">إلغاء</button><button class="btn" id="dlgOk" type="button"></button></div>
    </div>

  <div class="toast" id="toast" role="status"></div>
